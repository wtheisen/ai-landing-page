<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<script>
// The Book Editor's chapter pages (/ai2ai/editor/edit/<slug>, /view/<slug>) exist only inside its service worker.
// A hard refresh skips the worker and lands here: hand the page back to the editor, which reopens it.
(function () {
  var m = location.pathname.match(/^\/ai2ai\/editor\/((?:edit|view)\/[^\/]+)\/?$/);
  if (m) location.replace('/ai2ai/editor/?open=' + encodeURIComponent(m[1] + location.search + location.hash));
  else if (location.pathname.indexOf('/ai2ai/editor/') === 0) location.replace('/ai2ai/editor/');
})();
</script>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:15vh auto;max-width:32em;padding:0 16px;color:#222;background:#fff}a{color:#002B5B}</style>
</head><body>
<h1>Page not found</h1>
<p>There's nothing at this address. <a href="/">Go to the home page</a>.</p>
</body></html>
