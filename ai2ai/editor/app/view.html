<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002B5B">
<script>try { if (localStorage.getItem('ai2ai-topclear') === '0') document.documentElement.classList.add('no-topclear'); } catch (e) {}</script>
<title>Chapter</title>
<style>
@font-face { font-family: 'Inconsolata LGC'; src: url(../kit/fonts/Inconsolata-LGC.ttf) format('truetype'); font-weight: 400; }
@font-face { font-family: 'Inconsolata LGC'; src: url(../kit/fonts/Inconsolata-LGC-Bold.ttf) format('truetype'); font-weight: 700; }
:root { --top-clear: env(safe-area-inset-top); }
@media (display-mode: standalone) { :root { --top-clear: calc(env(safe-area-inset-top) + min(40px, env(safe-area-inset-top) * 1000)); } }   /* clear iOS 26's blur ramp, see editor.css */
html.no-topclear { --top-clear: env(safe-area-inset-top) !important; }   /* the home page's switch: no extra clearance */
body .navbar { padding-top: calc(10px + var(--top-clear)); padding-left: calc(15px + env(safe-area-inset-left)); padding-right: calc(15px + env(safe-area-inset-right)); }   /* installed app on a phone: clear the status bar (body: book.css loads after this and sets .navbar's padding) */
@media (display-mode: standalone) { body .navbar { position: sticky; top: 0; z-index: 20; } }   /* iOS 26 blurs an installed app's top edge unless a sticky, opaque, full-width bar sits there */
</style>
<link rel="stylesheet" href="../app/book.css">
</head>
<body>
<nav class="navbar web-only" aria-label="Chapter"><a class="brand" id="brand" href="#"></a><span class="spacer"></span><span id="nav"></span><a id="edit" href="#">Edit</a></nav>
<main class="book view" id="book"></main>
<script src="../app/live.js"></script>
<script src="../app/book.js"></script>
<script src="../app/ink.js"></script>
<script>
(async function () {
  const ch = location.pathname.split('/').filter(Boolean).pop(), q = new URLSearchParams(location.search), exporting = q.has('export');
  const grid = q.has('pane') || q.has('grid');   // a pane beside the editor: one edition, print layout, scrolling on its own
  const zoom = () => { if (!grid) document.documentElement.style.setProperty('--zoom', Math.min(1, (window.innerWidth - 32) / 576) * (window.eaiZoomK || 1)); };   // eaiZoomK: Lecture mode's own page zoom (ink.js)   // in a pane the editor sets the zoom
  zoom(); window.addEventListener('resize', zoom);
  if (grid) {
    document.documentElement.style.setProperty('--zoom', +q.get('zoom') || 0.5);
    const st = document.createElement('style'); st.textContent = '#book section.page{height:var(--page-h)!important;min-height:0!important;padding-bottom:0!important;overflow:hidden!important;cursor:pointer} #book b-code[dual],#book b-code[dual]+b-out,#book b-matmul{display:none!important} #book .page[data-ed-stale]::before{content:\'Slides changed: \' attr(data-ed-stale);position:absolute;top:6px;right:6px;z-index:3;font:600 10.5px/1.4 system-ui,sans-serif;color:#7a5c00;background:#fff3cd;border:1px solid #e6cf7a;border-radius:3px;padding:1px 6px} #book section.page.gmatch{box-shadow:0 0 0 3px #dcb439} #book section.page{transition:opacity .15s} #book{padding-top:50vh!important;padding-bottom:50vh!important} html,body{overscroll-behavior:none;overflow-x:hidden}';
    document.head.append(st); document.querySelector('.navbar').style.display = 'none'; document.documentElement.style.background = 'transparent'; document.body.style.cssText = 'margin:0;background:transparent';
  }
  Book.chapter = ch; Book.base = '../c/' + ch + '/'; Book.web = !grid; Book.exporting = exporting; if (exporting) document.documentElement.dataset.exporting = '1';
  const wanted = new URLSearchParams(location.search).get('view'); if (Book.views.includes(wanted)) Book.view = wanted;
  const info = await (await fetch('../api/info')).json(); Book.kit = info.kit; Book.mathml = !!info.offline;
  const version = new URLSearchParams(location.search).get('version');
  const d = await (await fetch(version ? '../api/history/' + ch + '?name=' + encodeURIComponent(version) : '../api/chapter/' + ch)).json();
  Book.load(document.getElementById('book'), d.content);
  document.title = Book.meta.title || ch;
  document.getElementById('brand').textContent = Book.meta.book || Book.meta.title || ch;
  document.getElementById('edit').href = '../edit/' + ch;
  if (version) { document.getElementById('edit').textContent = 'Old version: ' + version.replace(/^chapter-|\.html$/g, ''); document.getElementById('edit').removeAttribute('href'); }
  document.getElementById('nav').outerHTML = Book.pages().filter(p => p.dataset.part && Book.inView(p)).map(p => `<a href="#${p.id}">${Book.esc(p.dataset.part)}</a>`).join('')
    + (exporting ? '' : '<span style="opacity:.5">|</span>' + Book.views.map(v => `<a href="?view=${v}" style="${v === Book.view ? 'font-weight:700;text-decoration:underline' : ''}">${v[0].toUpperCase() + v.slice(1)}</a>`).join(''));
  await Book.ready(); Book.refresh(); await Book.ready(); Book.refresh();
  if (grid) Book.markStale();
  if (grid) {   // a pane beside the editor (see "panes" in editor.js): its pages in their own flow, scrolling natively
    const root = document.getElementById('book');
    let focus = null, busy = null, want = null;
    const topicsOf = p => ((p && p.getAttribute('data-topic')) || '').split(/\s+/).filter(Boolean);
    const shown = () => Book.pages().filter(p => Book.inView(p) && p.offsetParent);
    const applyFocus = () => Book.pages().forEach(p => {   // split chapters match by topic (the other document's pages have their own ids)
      if (focus && typeof focus === 'object') { const hit = p.id === focus.id || topicsOf(p).some(x => (focus.topics || []).includes(x)); p.style.opacity = focus.dim ? '.22' : ''; p.classList.toggle('gmatch', hit && !p.classList.contains('cover')); }
      else { p.classList.remove('gmatch'); p.style.opacity = focus && p.id !== focus ? '.22' : ''; }
    });
    const scrollTo = w => {   // put a page (by id, else the first on any of the topics) at height y of this pane
      if (busy) { want = w; return; }
      const list = shown(), all = Book.pages(), at = w.id ? all.findIndex(p => p.id === w.id) : -1;
      const near = at < 0 ? null : all.slice(0, at + 1).reverse().find(p => list.includes(p)) || all.slice(at).find(p => list.includes(p));   // a page this edition leaves out: the nearest one it shows
      const el = near || (w.topics && list.find(p => !p.classList.contains('cover') && topicsOf(p).some(t => w.topics.includes(t))));
      if (!el) { if (w.topics) parent.postMessage({ gridNoMatch: Book.view }, '*'); return; }
      window.scrollTo({ top: scrollY + el.getBoundingClientRect().top - w.y, behavior: w.smooth ? 'smooth' : 'auto' });
    };
    const anchor = () => { const p = shown().find(x => x.getBoundingClientRect().bottom > 0); return p ? { id: p.id, y: p.getBoundingClientRect().top } : null; };
    const reload = async () => {   // the chapter changed: draw it again in place, keeping the page at the top where it was
      const keep = anchor();
      busy = (async () => {
        const c = await (await fetch('../api/chapter/' + ch)).json();
        Book.load(root, c.content); await Book.ready(); Book.refresh(); Book.markStale(); applyFocus();
      })();
      try { await busy; } finally { busy = null; }
      if (keep) scrollTo(keep);
      if (want) { const w = want; want = null; scrollTo(w); }
    };
    // the editor's edits, page by page (see panePatch in editor.js): swap in the changed pages, drop the deleted ones, put
    // them in order; only what changed is drawn again, and the page at the top stays where it is
    let patching = Promise.resolve();
    const patch = P => { patching = patching.then(async () => {
      const keep = anchor();
      if (P.meta) Book.meta = Book.parse(P.meta + '\n').meta;
      const have = new Map(Book.pages().map(p => [p.id, p]));
      for (const [id, html] of Object.entries(P.pages)) {
        const t = document.createElement('template'); t.innerHTML = html.trim(); const el = t.content.firstElementChild; if (!el) continue;
        const old = have.get(id); if (old) old.replaceWith(el); else root.append(el); have.set(id, el);
      }
      const want = new Set(P.order); for (const [id, p] of have) if (!want.has(id)) { p.remove(); have.delete(id); }
      let at = root.querySelector(':scope > section.page');   // reorder with as few moves as possible (a moved page draws again)
      for (const id of P.order) { const p = have.get(id); if (!p) continue; if (p !== at) root.insertBefore(p, at); else at = at.nextElementSibling; while (at && at.localName !== 'section') at = at.nextElementSibling; }
      if (!innerWidth) { Book.markStale(); return; }   // a hidden pane (the edition being edited): laid out when it shows again (gridRefresh)
      await Book.ready(); Book.refresh(); Book.markStale(); applyFocus();
      if (keep) scrollTo(keep);
    }).catch(err => console.error(err)); };
    root.addEventListener('click', e => { const p = e.target.closest('section.page'); if (p && Date.now() - dragEnded > 400) parent.postMessage({ gridPick: p.id, view: Book.view }, '*'); });
    // blocks between the Reading and the Lecture (split chapters, see the editor's copyPageAcross): the editor asks
    // where a block dragged over this pane would go (gridDragOver, answered with gridDropAt and a blue line), and a
    // block dragged out of this pane is reported as it moves (gridDrag), so the editor can copy it in
    let ind = null, drag = null, dragEnded = 0;
    const dropAt = p => {
      if (!ind) { ind = document.createElement('div'); ind.style.cssText = 'position:absolute;height:3px;background:#1a73e8;border-radius:2px;z-index:50;pointer-events:none'; document.body.append(ind); }
      const pg = p && document.elementsFromPoint(p.x, p.y).map(n => n.closest && n.closest('#book section.page')).find(Boolean);
      if (!pg || pg.classList.contains('cover')) { ind.hidden = true; if (p) parent.postMessage({ gridDropAt: null }, '*'); return; }
      const r = pg.getBoundingClientRect(), s = r.width / 432, all = Book.blocks(pg);
      const vis = all.filter(b => !Book.isPinned(b) && b.getBoundingClientRect().height > 0);
      const nb = vis.find(b => { const q = b.getBoundingClientRect(); return p.y < q.top + q.height / 2; });
      const y = nb ? nb.getBoundingClientRect().top - 5 * s : vis.length ? vis[vis.length - 1].getBoundingClientRect().bottom + 5 * s : r.top + 20 * s;
      ind.hidden = false; ind.style.left = (r.left + 24 * s + scrollX) + 'px'; ind.style.width = (384 * s) + 'px'; ind.style.top = (y + scrollY) + 'px';
      parent.postMessage({ gridDropAt: { view: Book.view, page: pg.id, before: nb ? all.indexOf(nb) : -1, x: (p.x - r.left) / s, y: (p.y - r.top) / s } }, '*');
    };
    root.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.pointerType === 'touch' || !Book.split) return;
      const pg = e.target.closest('#book section.page'); if (!pg || pg.classList.contains('cover')) return;
      let b = e.target; while (b && b.parentElement !== pg) b = b.parentElement;
      const index = b ? Book.blocks(pg).indexOf(b) : -1; if (index < 0) return;
      e.preventDefault();   // no text selection: a drag here copies the block
      drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, page: pg.id, index, tag: b.tagName, el: b, live: false };
    });
    const sendDrag = (e, phase) => parent.postMessage({ gridDrag: { phase, view: Book.view, page: drag.page, index: drag.index, tag: drag.tag, x: e.clientX, y: e.clientY } }, '*');
    window.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.live) {
        if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
        drag.live = true; try { drag.el.setPointerCapture(e.pointerId); } catch (x) {}   // keep getting the pointer once it leaves this pane
        drag.el.style.outline = '2px solid #1a73e8'; drag.el.style.outlineOffset = '2px';
      }
      e.preventDefault(); sendDrag(e, 'move');
    });
    const endDrag = (e, phase) => {
      if (!drag || e.pointerId !== drag.id) return;
      if (drag.live) { drag.el.style.outline = ''; drag.el.style.outlineOffset = ''; dragEnded = Date.now(); sendDrag(e, phase); }
      drag = null;
    };
    window.addEventListener('pointerup', e => endDrag(e, 'end'));
    window.addEventListener('pointercancel', e => endDrag(e, 'cancel'));
    window.addEventListener('message', e => {
      const d = e.data || {};
      if ('gridDragOver' in d) dropAt(d.gridDragOver);
      if ('gridFocus' in d) { focus = d.gridFocus; applyFocus(); }
      if (d.gridScrollTo) scrollTo(d.gridScrollTo);
      if (d.gridZoom) { const keep = anchor(); document.documentElement.style.setProperty('--zoom', d.gridZoom); Book.refresh(); if (keep) scrollTo(keep); }
      if (d.gridReload) reload();
      if (d.gridPatch) patch(d.gridPatch);
      if (d.gridRefresh) patching = patching.then(async () => { await Book.ready(); Book.refresh(); applyFocus(); });   // shown again after being hidden
      if (d.gridFig) document.querySelectorAll('#book b-fig').forEach(f => { if (f.getAttribute('src') === d.gridFig) Book.reloadFig(f); });
    });
    window.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); parent.postMessage({ gridWheel: { dy: e.deltaY, x: e.clientX, y: e.clientY } }, '*'); }, { passive: false });   // a pinch here zooms all the panes; plain scrolling is this pane's own
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => window.addEventListener(t, e => e.preventDefault(), { passive: false }));
    { const c = Book.pages()[0]; if (c) window.scrollTo(0, scrollY + c.getBoundingClientRect().top - 24); }   // start at the cover (above it is room to line pages up)
    document.documentElement.classList.add('ink-ghost');   // the panes show the blanks' answers faintly (never Present here)
    document.documentElement.dataset.ready = '1'; parent.postMessage({ gridReady: Book.view }, '*'); return;
  }
  const report = Book.report, pages = Book.pages().length;
  Book.webExtras();
  if (exporting) {
    const html = await Book.snapshot();
    await fetch('../api/snapshot/' + ch, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ html, report, pages, eqs: [...document.querySelectorAll('b-eq')].map(e => e._key).filter(Boolean) }) });
  }
  if (!exporting) eaiInk({ dir: Book.meta.web || ('ai2ai/' + ch) });
  document.documentElement.dataset.ready = '1';
})();
</script>
</body>
</html>
