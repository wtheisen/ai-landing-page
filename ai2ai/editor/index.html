<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI2AI Book Editor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#002B5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- no apple-mobile-web-app-status-bar-style: without black-translucent iOS paints the status bar itself in the theme
     colour and the page starts below it (Apple's advice for iOS 26's edge blur, WebKit bug 317153). iOS only reads this
     when the app is added to the home screen, so an existing install needs removing and adding again. -->
<script>try { if (localStorage.getItem('ai2ai-topclear') === '0') document.documentElement.classList.add('no-topclear'); } catch (e) {}</script>
<meta name="apple-mobile-web-app-title" content="AI2AI">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root { --navy: #002B5B; --gold: #DCB439; --green: #38761D; --red: #B3261E; --ink: #1d2433; --muted: #5f6672; --line: #dde1e7; --bg: #f5f6f8; --card: #fff; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 15px/1.4 Arial, Helvetica, sans-serif; color: var(--ink); background: var(--bg); }
header { position: sticky; top: 0; z-index: 10; background: var(--navy); color: #fff; padding: calc(14px + var(--top-clear)) 16px 14px; }
:root { --top-clear: env(safe-area-inset-top); }
@media (display-mode: standalone) { :root { --top-clear: calc(env(safe-area-inset-top) + min(40px, env(safe-area-inset-top) * 1000)); } }   /* clear iOS 26's blur ramp, see app/editor.css */
html.no-topclear { --top-clear: env(safe-area-inset-top) !important; }   /* the home page's switch: no extra clearance */
header h1 { margin: 0; font-size: 19px; letter-spacing: .2px; }
header .sub { font-size: 12.5px; opacity: .75; margin-top: 2px; }
main { max-width: 980px; margin: 0 auto; padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: #e7eaef; color: var(--ink); }
.chip.ok { background: #2e7d32; color: #fff; } .chip.warn { background: #f2b51b; } .chip.bad { background: var(--red); color: #fff; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
.card h2 { font-size: 15px; margin: 0 0 8px; color: var(--navy); }
label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 8px 0 3px; }
input { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid #c3c8d0; border-radius: 6px; background: #fff; }
button, .btn { font: inherit; font-weight: 700; border: 1px solid #c3c8d0; background: #fff; color: var(--ink); border-radius: 6px; padding: 8px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-height: 38px; }
button.primary { background: var(--gold); border-color: var(--gold); color: #000; }
button:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { font-size: 13px; color: var(--muted); }
.note a { color: var(--navy); }
.unit { display: flex; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 20px 2px 8px; }
.unit .un { font: 700 13px Consolas, 'Inconsolata LGC', monospace; color: var(--navy); }
.shelf-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 2px 0; }
button.mini { min-height: 30px; padding: 4px 10px; font-size: 12.5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 14px; min-height: 60px; padding: 2px; border-radius: 8px; }
body.dragging .grid { outline: 1px dashed #c3c8d0; outline-offset: 4px; }
.book { container-type: inline-size; display: flex; flex-direction: column; gap: 6px; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.book.hole { opacity: .25; }
.book.ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; opacity: .95; filter: drop-shadow(0 10px 18px rgba(0,0,0,.25)); }
/* a 6x9 cover in miniature, laid out like the real one (book.css .cover): art on top, kicker, title, gold rule */
.cv { aspect-ratio: 6 / 9; display: flex; flex-direction: column; justify-content: space-between; background: #fff; border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 3px 10px rgba(0,43,91,.07); padding: 9cqw 6cqw 10cqw; text-decoration: none; color: inherit; overflow: hidden; cursor: grab; transition: box-shadow .15s, transform .15s; }
a.cv:hover { box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 8px 20px rgba(0,43,91,.14); transform: translateY(-2px); }
body.dragging .cv { cursor: grabbing; }
.cv-art { display: block; flex: 1 1 auto; min-height: 0; margin-top: 2cqw; }
.cv-art img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: top center; }
.cv-art.none { background: linear-gradient(135deg, #eef1f5, #f7f8fa); border-radius: 2px; }
.cv-art.none img { display: none; }
.cv-text { display: flex; flex-direction: column; gap: 2.6cqw; margin-top: 6cqw; }
.cv .kicker { font: 700 6.4cqw Consolas, 'Inconsolata LGC', monospace; color: var(--navy); letter-spacing: .3cqw; }
.cv-title { font-weight: 700; font-size: 10.5cqw; line-height: 1.04; color: var(--navy); overflow-wrap: anywhere; }
.cv .rule { width: 19cqw; height: 1.4cqw; min-height: 2px; background: var(--gold); border-radius: 1px; }
.book.planned .cv { background: transparent; border: 1.5px dashed #c3c8d0; box-shadow: none; justify-content: flex-end; }
.book.planned .cv-title, .book.planned .kicker { color: var(--muted); }
.book.planned .rule { background: #d5d9df; }
.cv-plan { font-size: 7cqw; font-weight: 700; color: #9aa1ab; text-transform: uppercase; letter-spacing: .5cqw; margin-top: 5cqw; }
.book .meta { font-size: 12px; min-height: 16px; display: flex; gap: 6px; flex-wrap: wrap; }
.book .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.book .acts .btn { min-height: 32px; padding: 4px 6px; font-size: 13px; }
.book .acts .lect { grid-column: 1 / -1; background: #002B5B; border-color: #002B5B; color: #fff; }
.book .acts .ans { grid-column: 1 / -1; text-align: center; font-size: 12px; color: #667; margin-top: -2px; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
.off { font-size: 12px; color: var(--muted); }
.off.full { color: var(--green); font-weight: 700; }
.edited { color: #8a6a00; font-weight: 700; }
progress { width: 100%; height: 6px; }
#msg { white-space: pre-wrap; }
</style>
</head>
<body>
<header><h1>AI2AI Book Editor</h1><div class="sub">Exploring Artificial Intelligence · works offline on this device</div></header>
<main>
  <div class="chips" id="chips"></div>

  <section class="card" id="signin" hidden>
    <h2>Sign in to GitHub</h2>
    <p class="note">The chapters live in a private GitHub repository. Paste a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a> with <b>Contents: Read and write</b> on that repository. It stays on this device.</p>
    <label for="repo">Repository</label><input id="repo" value="wtheisen/ai2ai-book" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label for="token">Token</label><input id="token" type="password" placeholder="github_pat_…" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row" style="margin-top:10px"><button class="primary" id="go">Sign in</button></div>
    <p class="note" id="smsg"></p>
  </section>

  <section class="card" id="sync" hidden>
    <div class="row" style="justify-content:space-between">
      <div><b id="where"></b><div class="note" id="when"></div></div>
      <div class="row"><button id="pull" class="primary">Sync now</button><button id="all">Make all available offline</button></div>
    </div>
    <progress id="prog" hidden></progress>
    <div class="note" id="msg"></div>
  </section>

  <div id="list"></div>

  <section class="card" id="install" hidden>
    <h2>Keep it on this device</h2>
    <p class="note" id="install-text"></p>
  </section>

  <p class="note" id="foot"></p>
  <p class="note" id="ver"></p>
</main>
<script src="store.js"></script>
<script src="home.js"></script>
</body>
</html>
