<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI2AI Review</title>
<meta name="theme-color" content="#002B5B">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon-192.png">
<!-- The home screen of the iPhone review app (ios/AI2AIReview, AI2AI Review): every chapter of both books in contents
     order, a badge with its open comments, a tap opens the chapter in the editor (locked, on its slides). Same storage
     as the editor home (index.html) and present.html: sign-in, synced chapters, offline copies. Works in Safari too. -->
<style>
:root { --navy: #002B5B; --gold: #DCB439; --green: #38761D; --red: #B3261E; --ink: #1d2433; --muted: #5f6672; --line: #dde1e7; --bg: #f2f2f7; --row: #fff; --sep: #e3e5ea; }
@media (prefers-color-scheme: dark) { :root { --ink: #f2f3f5; --muted: #9ca3ae; --line: #3a3d44; --bg: #000; --row: #1c1c1e; --sep: #2c2c30; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 16px/1.35 -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
header { position: sticky; top: 0; z-index: 10; background: var(--navy); color: #fff; padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 10px; }
header h1 { margin: 0; font-size: 20px; letter-spacing: .2px; }
header .sub { font-size: 12.5px; opacity: .75; margin-top: 1px; }
header .grow { flex: 1 1 auto; min-width: 0; }
header button { font: 600 15px -apple-system, Arial, sans-serif; border: 0; border-radius: 8px; padding: 7px 12px; background: var(--gold); color: #000; min-height: 36px; cursor: pointer; }
header button.icon { background: transparent; color: #fff; padding: 6px; min-width: 40px; display: inline-flex; align-items: center; justify-content: center; }
header button:disabled { opacity: .5; }
main { max-width: 700px; margin: 0 auto; padding: 10px 0 calc(28px + env(safe-area-inset-bottom)); }
.note { font-size: 13px; color: var(--muted); padding: 0 16px; }
#msg { white-space: pre-wrap; min-height: 0; margin: 4px 0; }
#msg:empty { display: none; }
progress { display: block; width: calc(100% - 32px); margin: 6px 16px; height: 4px; }
.card { background: var(--row); border-radius: 12px; padding: 14px; margin: 8px 16px 14px; }
.card h2 { font-size: 16px; margin: 0 0 6px; color: var(--ink); }
label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
input { width: 100%; font: 16px -apple-system, Arial, sans-serif; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); -webkit-user-select: text; user-select: text; }
.card button { font: 600 16px -apple-system, Arial, sans-serif; border: 0; border-radius: 10px; padding: 10px 16px; background: var(--navy); color: #fff; margin-top: 12px; min-height: 44px; width: 100%; }
.book { display: flex; align-items: baseline; gap: 8px; padding: 14px 16px 6px; }
.book b { font-size: 22px; color: var(--ink); } .book span { font-size: 13px; color: var(--muted); }
.unit { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 14px 16px 6px 20px; }
.unit .un { font: 700 13px Consolas, 'Inconsolata LGC', ui-monospace, monospace; color: var(--gold); }
.list { background: var(--row); border-radius: 12px; margin: 0 16px; overflow: hidden; }
a.ch { display: flex; align-items: center; gap: 12px; padding: 9px 12px; text-decoration: none; color: inherit; position: relative; min-height: 76px; }
a.ch + a.ch::before { content: ''; position: absolute; top: 0; left: 70px; right: 0; border-top: .5px solid var(--sep); }
a.ch:active { background: rgba(127,127,127,.15); }
.cv { flex: none; width: 44px; aspect-ratio: 6 / 9; background: #fff; border: .5px solid #d4d8de; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.12); display: flex; flex-direction: column; padding: 4px 3px 3px; overflow: hidden; }
.cv img { display: block; width: 100%; flex: 1 1 auto; min-height: 0; object-fit: contain; object-position: top center; }
.cv .rule { height: 2px; width: 12px; background: var(--gold); border-radius: 1px; margin-top: 2px; flex: none; }
.cv.none img { display: none; }
.cv.none::before { content: ''; flex: 1 1 auto; background: linear-gradient(135deg, #eef1f5, #f7f8fa); }
.txt { flex: 1 1 auto; min-width: 0; }
.num { font: 700 12.5px Consolas, 'Inconsolata LGC', ui-monospace, monospace; color: var(--muted); }
.ttl { font-size: 16px; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.why { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.badge { flex: none; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--red); color: #fff; font: 700 14px/24px -apple-system, Arial, sans-serif; text-align: center; }
.badge.claude { background: var(--navy); }
@media (prefers-color-scheme: dark) { .badge.claude { background: #3d6db5; } }
.chev { flex: none; color: var(--muted); opacity: .6; font-size: 20px; }
</style>
</head>
<body>
<header>
  <div class="grow"><h1>AI2AI Review</h1><div class="sub" id="when">Not synced yet</div></div>
  <button id="pull" hidden>Sync</button>
  <button id="gear" class="icon" title="Settings" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main>
  <section class="card" id="prefs" hidden>
    <h2>Settings</h2>
    <label for="name">Your name on comments</label><input id="name" autocapitalize="words" autocorrect="off" spellcheck="false">
  </section>
  <section class="card" id="signin" hidden>
    <h2>Sign in to GitHub</h2>
    <p class="note" style="padding:0">The same fine-grained token as the Book Editor (Contents: Read and write on <b>wtheisen/ai2ai-book</b>). It stays on this device.</p>
    <label for="repo">Repository</label><input id="repo" value="wtheisen/ai2ai-book" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label for="token">Token</label><input id="token" type="password" placeholder="github_pat_…" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="go">Sign in</button>
  </section>
  <progress id="prog" hidden></progress>
  <div class="note" id="msg"></div>
  <div id="list"></div>
</main>
<script src="store.js"></script>
<script src="review.js"></script>
</body>
</html>
